[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "count-flow-matching"
version = "0.1.0"
description = "Flow Matching for Count Data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "torch>=2.1", "scipy", "POT", "tqdm"]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipywidgets", "matplotlib", "pandas", "scikit-learn"]
scrna = ["scanpy", "anndata", "scvi-tools"]
neural = ["requests", "beautifulsoup4", "pandas", "matplotlib"]
nwb = ["h5py", "remfile", "dandi", "pynwb", "nlb-tools"]
test = ["pytest", "nbformat", "pyflakes"]

[tool.setuptools.packages.find]
include = ["count_fm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
